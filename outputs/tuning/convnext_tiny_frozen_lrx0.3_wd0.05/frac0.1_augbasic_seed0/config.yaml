seed: 0
output_dir: outputs/tuning
data:
  name: cifar10
  root: data
  image_size: 224
  val_fraction: 0.1
  split_seed: 0
  train_fraction: 0.1
  augmentation: basic
  num_workers: 4
  eval_num_workers: 2
model:
  name: convnext_tiny.fb_in1k
  pretrained: true
  freeze_backbone: true
train:
  epochs: 8
  batch_size: 32
  optimizer: adamw
  lr_head: 0.0003
  lr_backbone: 3.0e-05
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.0
  amp: true
  grad_accum_steps: 1
  skip_test: true
  keep_checkpoint: false
experiment: convnext_tiny_frozen_lrx0.3_wd0.05
progress_bar: false
