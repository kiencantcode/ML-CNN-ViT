seed: 0
output_dir: outputs/tuning
data:
  name: cifar10
  root: data
  image_size: 224
  val_fraction: 0.1
  split_seed: 0
  train_fraction: 0.1
  augmentation: basic
  num_workers: 4
  eval_num_workers: 2
model:
  name: resnet50.a1_in1k
  pretrained: true
  freeze_backbone: true
train:
  epochs: 8
  batch_size: 32
  optimizer: adamw
  lr_head: 0.001
  lr_backbone: 0.0001
  weight_decay: 0.005
  warmup_epochs: 1
  label_smoothing: 0.0
  amp: true
  grad_accum_steps: 1
  skip_test: true
  keep_checkpoint: false
experiment: resnet50_frozen_lrx1_wd0.005
progress_bar: false
