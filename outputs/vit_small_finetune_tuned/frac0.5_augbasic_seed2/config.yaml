seed: 2
output_dir: outputs
data:
  name: cifar10
  root: data
  image_size: 224
  val_fraction: 0.1
  split_seed: 0
  train_fraction: 0.5
  augmentation: basic
  num_workers: 4
  eval_num_workers: 2
model:
  name: deit_small_patch16_224.fb_in1k
  pretrained: true
  freeze_backbone: false
train:
  epochs: 8
  batch_size: 32
  optimizer: adamw
  lr_head: 0.001
  lr_backbone: 3.0e-05
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.0
  amp: true
  grad_accum_steps: 1
  grad_clip: null
  save_last: true
experiment: vit_small_finetune_tuned
progress_bar: false
